<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pull File - Anton Animation</title>

<style>

:root {
    --bg: #0b0d12;
    --panel: #121620;
    --panel2: #171b27;
    --text: #f7f7fb;
    --muted: #a8afbf;
    --accent: #9b6cff;
    --accent2: #c5a8ff;
    --border: #272d3b;
}

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;

    background:
        radial-gradient(
            circle at 15% 0%,
            #21153d 0,
            transparent 35%
        ),
        var(--bg);

    color: var(--text);
}

header {
    padding: 60px 24px;
    text-align: center;
    border-bottom: 1px solid var(--border);

    background:
        linear-gradient(
            180deg,
            rgba(155,108,255,.10),
            transparent
        );
}

header h1 {
    margin: 0 0 10px;
    font-size: 42px;
    letter-spacing: -.03em;
}

header p {
    margin: 0;
    color: var(--muted);
}

main {
    max-width: 1000px;
    margin: auto;
    padding: 40px 24px 80px;
}

.back {
    display: inline-block;
    margin-bottom: 30px;
    padding: 11px 16px;

    background: var(--panel2);
    color: var(--text);

    text-decoration: none;

    border: 1px solid var(--border);
    border-radius: 12px;

    font-weight: 700;
    transition: .2s;
}

.back:hover {
    background: #211b30;
    border-color: #5b477f;
}

h2 {
    margin: 0 0 8px;
    font-size: 30px;
}

.intro {
    margin: 0 0 30px;
    color: var(--muted);
}

.grid {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
}

.card {
    background:
        linear-gradient(
            145deg,
            var(--panel2),
            var(--panel)
        );

    border: 1px solid var(--border);
    padding: 25px;
    border-radius: 20px;

    text-align: center;

    transition:
        .2s transform,
        .2s border-color,
        .2s box-shadow;
}

.card:hover {
    transform: translateY(-4px);
    border-color: #5b477f;

    box-shadow:
        0 16px 45px rgba(0,0,0,.25);
}

.card h3 {
    margin: 0 0 10px;
    font-size: 20px;
}

.card p {
    margin: 0;
    color: var(--muted);
    line-height: 1.5;
}

.download {
    display: inline-block;

    margin-top: 20px;
    padding: 12px 20px;

    background: var(--accent);
    color: white;

    text-decoration: none;

    border-radius: 12px;

    font-weight: 800;

    transition: .2s;
}

.download:hover {
    background: #aa80ff;
    transform: translateY(-1px);
}

footer {
    text-align: center;

    padding: 28px 20px;

    color: #777f90;

    border-top: 1px solid var(--border);

    font-size: 13px;
}

footer p {
    margin: 5px 0;
}

@media (max-width: 600px) {

    header {
        padding: 50px 20px;
    }

    header h1 {
        font-size: 34px;
    }

    main {
        padding: 30px 18px 60px;
    }

}

</style>

</head>

<body>


<header>

    <h1>🎬 Anton Animation</h1>

    <p>Pull File Animation Variants</p>

</header>


<main>


<a class="back" href="./index.html">
    ← Back to Animations
</a>


<h2>Pull File</h2>

<p class="intro">
    Choose a Pull File variant to download.
</p>


<div class="grid">


    <!-- PULL VARIANT 1 -->

    <div class="card">

        <h3>Pull Variant 1</h3>

        <p>
            Pull File animation - Variant 1
        </p>

        <a
            class="download"
            href="/Anton-Animation/pull-file%283%29.pptx"
        >
            ⬇ Download
        </a>

    </div>


    <!-- PULL VARIANT 2 -->

    <div class="card">

        <h3>Pull Variant 2</h3>

        <p>
            Pull File animation - Variant 2
        </p>

        <a
            class="download"
            href="/Anton-Animation/pull-file%284%29.pptx"
        >
            ⬇ Download
        </a>

    </div>


</div>


</main>


<footer>

    <p>© 2026 Anton Animation</p>

    <p>Created by Anton Savin Sibu</p>

</footer>


</body>

</html>
